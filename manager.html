<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ผู้จัดการ | HR System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- คัดลอกเฉพาะส่วนด้านล่างนี้ไปแทนที่ด้านใน <body> ของไฟล์ manager.html เดิม -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">HR Dashboard</a>
            <div class="d-flex text-white align-items-center gap-3">
                <span id="navUserInfo" class="fw-bold"></span>
                <button class="btn btn-sm btn-danger rounded-pill px-3" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 mb-5 px-4">
        <h3 class="mb-4 fw-bold text-primary">ผู้จัดการ (Manager)</h3>
        <div class="row">
            <div class="col-lg-8">
                <div class="card card-custom p-4">
                    <h5 class="menu-title">อนุมัติคำขอการลาหยุด (ของพนักงาน)</h5>
                    <table class="table table-custom table-hover text-center align-middle">
                        <thead><tr><th>พนักงาน</th><th>ประเภท</th><th>วันที่ลา</th><th>เหตุผล</th><th>สถานะ</th><th>การตัดสินใจ</th></tr></thead>
                        <tbody id="managerApprovalTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card card-custom p-4">
                    <h5 class="menu-title">จัดการการลาของตนเอง</h5>
                    <div class="mb-3 d-flex justify-content-between text-center bg-light p-2 rounded">
                        <div><small>ลาป่วย</small><br><strong id="mgrSickBal" class="text-danger fs-5"></strong></div>
                        <div><small>ลากิจ</small><br><strong id="mgrPersBal" class="text-danger fs-5"></strong></div>
                        <div><small>ลาพักร้อน</small><br><strong id="mgrAnnBal" class="text-danger fs-5"></strong></div>
                    </div>
                    <form onsubmit="submitLeaveManager(event)">
                        <select class="form-select mb-2" id="mgrLeaveType" required>
                            <option value="" disabled selected>เลือกประเภทการลา</option>
                            <option value="sick">ลาป่วย</option>
                            <option value="personal">ลากิจ</option>
                            <option value="annual">ลาพักร้อน</option>
                        </select>
                        <input type="date" class="form-control mb-2" id="mgrLeaveDate" required>
                        <input type="text" class="form-control mb-3" id="mgrLeaveReason" placeholder="เหตุผลการลา" required>
                        <button type="submit" class="btn btn-primary w-100 py-2">ยื่นคำขอการลา</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- ========================================== -->
    <!-- ส่วนเสริมความมืออาชีพด้วย Bootstrap 5 Modal & Toast -->
    <!-- ========================================== -->

    <!-- 1. แจ้งเตือน Toast (มุมขวาล่าง) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast shadow-lg border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white" id="toastHeader">
                <i class="bi bi-bell-fill me-2"></i>
                <strong class="me-auto">การแจ้งเตือนจากระบบ</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body fw-medium" id="toastMessage" style="font-size: 1.05rem;">
                <!-- ข้อความจะเปลี่ยนไปตามการทำงาน -->
            </div>
        </div>
    </div>

    <!-- 2. Modal สำหรับ Admin แก้ไขชื่อพนักงาน -->
    <div class="modal fade" id="editEmpModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">แก้ไขข้อมูลพนักงาน</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ชื่อ-นามสกุลใหม่</label>
                        <input type="text" class="form-control form-control-lg" id="editEmpNameInput">
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary px-4" onclick="saveEditEmployee()">บันทึกการเปลี่ยนแปลง</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Modal สำหรับ Manager แก้ไขการลา -->
    <div class="modal fade" id="editLeaveModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title fw-bold">แก้ไขคำขอการลาหยุด (Manager)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">วันที่ลา</label>
                        <input type="date" class="form-control" id="editLeaveDateInput">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">เหตุผลการลา</label>
                        <input type="text" class="form-control" id="editLeaveReasonInput">
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-warning px-4 fw-bold" onclick="saveEditLeave()">บันทึกการแก้ไข</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script> checkAuth('manager'); renderManagerUI(); </script>
    <script> 
        checkAuth('manager'); 
        renderManagerUI(); 
    </script>
</body>
</html>
