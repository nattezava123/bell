<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>พนักงาน | HR System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar (มีปุ่ม 3 ขีดสำหรับพับเก็บบนมือถือ) -->
    <nav class="navbar navbar-expand-md navbar-dark navbar-custom">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="#">HR Dashboard</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
                <div class="d-flex flex-column flex-md-row align-items-md-center gap-2 mt-3 mt-md-0">
                    <span id="navUserInfo" class="fw-bold text-white text-center text-md-end mb-2 mb-md-0"></span>
                    <button class="btn btn-sm btn-danger rounded-pill px-4 py-2" onclick="logout()">ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3 mt-md-4 mb-5 px-3 px-md-4">
        <h3 class="mb-3 mb-md-4 fw-bold text-info">พนักงาน (Employee)</h3>
        
        <div class="row">
            <!-- คอลัมน์ลงเวลา -->
            <div class="col-12 col-lg-7">
                <div class="card card-custom p-3 p-md-4 text-center">
                    <h5 class="menu-title text-start">ระบบบันทึกเวลาการปฏิบัติงาน</h5>
                    <h5 class="text-secondary mt-2 mt-md-3" id="empCurrentDate"></h5>
                    <h1 class="display-4 fw-bold text-dark my-3 my-md-4" id="empCurrentTime">00:00:00</h1>
                    
                    <div class="d-flex justify-content-center gap-3 mb-4 clock-buttons">
                        <button class="btn btn-success btn-lg px-4 fw-bold" onclick="clockIn()" id="btnClockIn"><i class="bi bi-box-arrow-in-right me-1"></i> เข้างาน</button>
                        <button class="btn btn-danger btn-lg px-4 fw-bold" onclick="clockOut()" id="btnClockOut" disabled><i class="bi bi-box-arrow-right me-1"></i> ออกงาน</button>
                    </div>

                    <div class="text-start bg-light p-2 p-md-3 rounded-3 border">
                        <h6 class="fw-bold mb-2">ประวัติการลงเวลาทำงาน</h6>
                        <!-- หุ้ม Table ด้วย table-responsive -->
                        <div class="table-responsive">
                            <table class="table table-sm text-center align-middle small bg-white mb-0 text-nowrap">
                                <thead><tr><th>วันที่</th><th>เวลาเข้า</th><th>เวลาออก</th><th>ชม.ปกติ</th><th class="text-danger">OT</th></tr></thead>
                                <tbody id="empWorkLogTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- คอลัมน์การลา -->
            <div class="col-12 col-lg-5">
                <div class="card card-custom p-3 p-md-4">
                    <h5 class="menu-title">ระบบการลาหยุด (ตามกฎหมายแรงงาน)</h5>
                    <div class="mb-3 d-flex justify-content-between text-center bg-light p-3 rounded leave-balances">
                        <div><small class="fw-bold">ลาป่วย</small><br><strong id="empSickBal" class="text-danger fs-4"></strong><small> วัน</small></div>
                        <div><small class="fw-bold">ลากิจ</small><br><strong id="empPersBal" class="text-danger fs-4"></strong><small> วัน</small></div>
                        <div><small class="fw-bold">ลาพักร้อน</small><br><strong id="empAnnBal" class="text-danger fs-4"></strong><small> วัน</small></div>
                    </div>
                    
                    <form onsubmit="submitLeaveEmployee(event)" class="mb-4 p-3 rounded-3 border">
                        <h6 class="fw-bold mb-3">ยื่นฟอร์มคำขอการลาหยุด</h6>
                        <select class="form-select mb-2" id="empLeaveType" required>
                            <option value="" disabled selected>เลือกประเภทการลา</option>
                            <option value="sick">ลาป่วย (Sick Leave)</option>
                            <option value="personal">ลากิจ (Personal Leave)</option>
                            <option value="annual">ลาพักร้อน (Annual Leave)</option>
                        </select>
                        <input type="date" class="form-control mb-2" id="empLeaveDate" required>
                        <input type="text" class="form-control mb-3" id="empLeaveReason" placeholder="ระบุเหตุผล" required>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ส่งคำขอ</button>
                    </form>

                    <h6 class="fw-bold mb-3">สถานะการอนุมัติคำขอการลา</h6>
                    <!-- หุ้ม Table ด้วย table-responsive -->
                    <div class="table-responsive">
                        <table class="table table-custom table-hover table-sm text-center align-middle small mb-0 text-nowrap">
                            <thead><tr><th>ประเภท</th><th>วันที่ขอลา</th><th>เหตุผล</th><th>สถานะ</th></tr></thead>
                            <tbody id="empLeaveStatusTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- แจ้งเตือน Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast shadow-lg border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white" id="toastHeader">
                <strong class="me-auto">การแจ้งเตือนจากระบบ</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body fw-medium" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script> checkAuth('employee'); renderEmployeeUI(); </script>
</body>
</html>
